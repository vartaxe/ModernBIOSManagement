name: PowerShell validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PSScriptAnalyzer
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      - name: Validate PowerShell syntax and analyzer findings
        shell: powershell
        run: |
          $syntaxErrors = @()
          Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter '*.ps1' -File -Recurse | ForEach-Object {
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
              if ($parseErrors) {
                  $syntaxErrors += $parseErrors | ForEach-Object {
                      "$($_.Extent.File):$($_.Extent.StartLineNumber):$($_.Message)"
                  }
              }
          }

          if ($syntaxErrors.Count -gt 0) {
              $syntaxErrors | Write-Error
              throw 'PowerShell syntax validation failed.'
          }

          $findings = @(Invoke-ScriptAnalyzer `
              -Path $env:GITHUB_WORKSPACE `
              -Recurse `
              -Severity Error `
              -ExcludeRule PSAvoidUsingConvertToSecureStringWithPlainText)

          if ($findings.Count -gt 0) {
              $findings | Format-List
              throw 'PSScriptAnalyzer reported error-severity findings.'
          }

          $warnings = @(Invoke-ScriptAnalyzer `
              -Path $env:GITHUB_WORKSPACE `
              -Recurse `
              -Severity Warning `
              -ExcludeRule PSAvoidUsingConvertToSecureStringWithPlainText)

          if ($warnings.Count -gt 0) {
              Write-Warning "PSScriptAnalyzer reported $($warnings.Count) warning-level findings in legacy scripts."
              $warnings | Select-Object RuleName, ScriptName, Line, Message | Format-Table -AutoSize
          }

      - name: Run regression suites
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = @(Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'Tests') -Filter '*.Tests.ps1' -File)
          if ($tests.Count -eq 0) {
              throw 'No regression suites were discovered.'
          }
          foreach ($test in $tests) {
              & $test.FullName
          }
